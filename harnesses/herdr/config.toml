onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[terminal]
kitty_graphics = true

[ui]
# No pedir nombre manual para permitir que herdr-auto-title nombre las pestañas automáticamente
prompt_new_tab_name = false

# Sidebar context + provider limit rows (Agent Usage)
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "$icon", "$title"],
  ["$provider", "$limit"],
  ["$cache_high", { token = "$cache_mid", fg = "#e0af68" }, { token = "$cache_low", fg = "#f7768e" }],
  ["$context"],
]

# Mostrar tópico activo del workspace en el sidebar (Auto Title)
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace", "branch", "git_status"],
  [{ token = "$topic", bold = true, dim = false }],
]

# Toast delivery (notificaciones de alertas y cuotas de uso)
[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-right"

[keys]
# Prefix por defecto: ctrl+b

# Alternar la barra lateral (VS Code style: Explorer + Git + Search) a la derecha
[[keys.command]]
key = "prefix+e"
type = "shell"
command = "herdr plugin action invoke herdr-sidebar.open-sidebar"

[[keys.command]]
key = "alt+e"
type = "shell"
command = "herdr plugin action invoke herdr-sidebar.open-sidebar"

# Quick Open de archivos estilo VS Code (Ctrl+P)
[[keys.command]]
key = "prefix+p"
type = "shell"
command = "herdr plugin action invoke herdr-sidebar.quick-open"

# Abrir directamente en Source Control / Git (Ctrl+Shift+G)
[[keys.command]]
key = "prefix+g"
type = "shell"
command = "herdr plugin action invoke herdr-sidebar.show-git"

# Búsqueda global de texto en el proyecto (Ctrl+Shift+F)
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke herdr-sidebar.show-search"

# Abrir panel emergente de cuotas y uso de agentes (Agent Usage / Limits)
[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "usagebar.open-limits"

[[keys.command]]
key = "alt+u"
type = "plugin_action"
command = "usagebar.open-limits"

# Refrescar métricas y cuotas
[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "usagebar.refresh"

# Paleta de comandos interactiva fzf (Prefix+Espacio o Ctrl+Shift+P)
[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "jt.command-palette.open"

[[keys.command]]
key = "ctrl+shift+p"
type = "plugin_action"
command = "jt.command-palette.open"

# Monitor de CPU y RAM de espacios y agentes (Prefix+r o Alt+r)
[[keys.command]]
key = "prefix+r"
type = "plugin_action"
command = "ez-corp.space-usage.monitor"

[[keys.command]]
key = "alt+r"
type = "plugin_action"
command = "ez-corp.space-usage.monitor"

# Panel de revisión de código y diffs (reviewr - Prefix+d o Alt+d)
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

[[keys.command]]
key = "alt+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
