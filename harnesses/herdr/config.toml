onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[terminal]
kitty_graphics = true

[ui]
# Do not prompt for manual tab name to allow herdr-auto-title to name tabs automatically
prompt_new_tab_name = false

# Sidebar context + provider limit rows (Agent Usage)
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "$icon", "$title"],
  ["$provider", "$limit"],
  ["$cache_high", { token = "$cache_mid", fg = "#e0af68" }, { token = "$cache_low", fg = "#f7768e" }],
  ["$context"],
]

# Display active workspace topic in sidebar (Auto Title)
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace", "branch", "git_status"],
  [{ token = "$topic", bold = true, dim = false }],
]

# Toast delivery (alert notifications and quota limits)
[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-right"

[keys]
# Default prefix: ctrl+b

# Toggle right sidebar (VS Code style: Explorer + Git + Search)
[[keys.command]]
key = "prefix+e"
type = "shell"
command = "herdr plugin action invoke herdr-sidebar.open-sidebar"

[[keys.command]]
key = "alt+e"
type = "shell"
command = "herdr plugin action invoke herdr-sidebar.open-sidebar"

# Quick Open file picker (Ctrl+P style)
[[keys.command]]
key = "prefix+p"
type = "shell"
command = "herdr plugin action invoke herdr-sidebar.quick-open"

# Open Source Control / Git directly (Ctrl+Shift+G)
[[keys.command]]
key = "prefix+g"
type = "shell"
command = "herdr plugin action invoke herdr-sidebar.show-git"

# Global project text search (Ctrl+Shift+F)
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke herdr-sidebar.show-search"

# Open Agent Usage limits popup (Alt+u / Prefix+u)
[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "usagebar.open-limits"

[[keys.command]]
key = "alt+u"
type = "plugin_action"
command = "usagebar.open-limits"

# Refresh metrics and quota limits
[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "usagebar.refresh"

# Interactive fzf command palette (Ctrl+Shift+P / Prefix+Space)
[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "jt.command-palette.open"

[[keys.command]]
key = "ctrl+shift+p"
type = "plugin_action"
command = "jt.command-palette.open"

# CPU & RAM resource monitor (Prefix+r / Alt+r)
[[keys.command]]
key = "prefix+r"
type = "plugin_action"
command = "ez-corp.space-usage.monitor"

[[keys.command]]
key = "alt+r"
type = "plugin_action"
command = "ez-corp.space-usage.monitor"

# Code diff and review panel (reviewr - Prefix+d / Alt+d)
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

[[keys.command]]
key = "alt+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
